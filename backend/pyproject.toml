[project]
name = "help-me-learn-backend"
version = "0.1.0"
description = "LLM-agnostic learning agent backend: provider adapters, RAG over uploaded documents, usage tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pypdf>=5.0",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
